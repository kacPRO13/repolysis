<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Repolysis: a magnifying lens whose rim is a donut chart, with bars inside -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d31"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b5bac1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#5865F2" stroke-opacity=".45" stroke-width="2"/>
  <!-- handle -->
  <path d="M40 40 L51 51" stroke="url(#handle)" stroke-width="8" stroke-linecap="round"/>
  <!-- lens glass -->
  <circle cx="28" cy="28" r="15" fill="#5865F2" fill-opacity=".14"/>
  <!-- donut rim: three slices -->
  <g transform="rotate(-90 28 28)" fill="none" stroke-width="6">
    <circle cx="28" cy="28" r="15" stroke="#5865F2" stroke-dasharray="44 50.25"/>
    <circle cx="28" cy="28" r="15" stroke="#EB459E" stroke-dasharray="24 70.25" stroke-dashoffset="-47"/>
    <circle cx="28" cy="28" r="15" stroke="#57F287" stroke-dasharray="17.25 77" stroke-dashoffset="-74"/>
  </g>
  <!-- bars inside the lens -->
  <g fill="#ffffff">
    <rect x="20.5" y="28" width="4" height="7" rx="1.5"/>
    <rect x="26" y="24" width="4" height="11" rx="1.5"/>
    <rect x="31.5" y="20" width="4" height="15" rx="1.5"/>
  </g>
</svg>
